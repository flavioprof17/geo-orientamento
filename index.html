<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geografia in 3D – Prima media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#1b2430; --muted:#5b6675; --line:#e2e7ee;
  --accent:#e4572e; --blue:#2a7de1; --chip:#eef2f7; --ok:#2e9d5b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#132033;color:#fff;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
nav button{background:#24344d;color:#e8eef7;border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:#ffd23f;color:#132033;font-weight:700}
.tools{display:flex;gap:6px}
.tools button{background:#e4572e;color:#fff;border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;cursor:pointer;font-weight:700}
.tools button.ghost{background:#24344d}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:#0b1220}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:12px;top:12px;max-width:min(560px,calc(100% - 24px));background:rgba(19,32,51,.88);color:#fff;
  padding:10px 14px;border-radius:12px;font-size:17px;line-height:1.35;display:none;pointer-events:none}
#hud .y{background:#ffd23f;color:#132033;border-radius:6px;padding:0 6px;font-weight:700}
#hud .c{background:#4dd0e1;color:#132033;border-radius:6px;padding:0 6px;font-weight:700}
#hud small{opacity:.85;font-size:14px}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.96);color:var(--ink);border-radius:12px;padding:10px 14px;
  font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none;max-width:290px;border:2px solid #132033}
#legend b{display:block;margin-bottom:6px;letter-spacing:.5px}
.lg{display:flex;align-items:center;gap:8px;margin:3px 0}
.lg i{display:inline-block;width:26px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none;font-style:normal}
.lg i.ln{height:0;border:0;border-top:4px solid var(--c)}
.lg i.ln.dash{border-top-style:dashed}
.lg i.sy{border:0;text-align:center;font-size:18px;line-height:16px;height:auto}
.lg-note{font-size:14px;color:var(--muted);max-width:240px}
#hint{position:absolute;right:12px;bottom:10px;color:rgba(255,255,255,.7);font-size:13px;pointer-events:none;text-shadow:0 1px 2px #000}
aside{width:390px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px 18px 30px}
aside h2{margin:0 0 6px;font-size:23px;line-height:1.15}
aside h3{margin:18px 0 6px;font-size:17px;color:#132033;border-top:1px solid var(--line);padding-top:12px}
aside p{margin:6px 0;line-height:1.45}
.lead{font-size:16.5px}
.note{background:#fff8dc;border-left:4px solid #ffd23f;padding:8px 10px;border-radius:6px;font-size:15.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
aside button{font:inherit;font-size:15px;border:1px solid #c9d2de;background:#f7f9fc;border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--ink)}
aside button:hover{background:#e9eef6}
aside button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
aside button.on{background:#132033;color:#ffd23f;border-color:#132033;font-weight:700}
.seg{display:flex;gap:0;margin:8px 0}
.seg button{border-radius:0;flex:1;padding:10px 6px}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
label.rng{display:flex;justify-content:space-between;font-size:15px;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
label.tog{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;font-size:15.5px}
label.tog input{width:20px;height:20px;accent-color:var(--blue)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:2px}
.result{background:#eef7f1;border:1px solid #bfe3cc;border-radius:10px;padding:10px;margin-top:8px;font-size:15.5px;line-height:1.5;min-height:20px}
.big{font-size:32px;font-weight:700;text-align:center;letter-spacing:1px;margin:6px 0;color:#132033}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin-top:6px}
td,th{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{background:var(--chip)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center;font-size:15px}
.calc input,.calc select{font:inherit;font-size:15px;padding:6px;border:1px solid #c9d2de;border-radius:8px;width:100%}
.read{float:right;margin-top:2px}
footer.sig{margin-top:22px;font-size:13px;color:var(--muted);text-align:right}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#132033;color:#fff;padding:30px;text-align:center;font-size:20px;z-index:99}
#err[hidden]{display:none}
nav button .short{display:none}
#legend{cursor:pointer;-webkit-tap-highlight-color:transparent}
#legend>b::after{content:' ▾';color:#5b6675}
#legend.mini>b{margin-bottom:0}
#legend.mini>b::after{content:' ▸'}
#legend.mini .lg,#legend.mini .lg-note{display:none}
@media (max-width:900px){
  body{overflow:auto}
  header{position:sticky;top:0;z-index:10;padding:6px 10px;gap:8px;flex-wrap:nowrap}
  .brand{font-size:16px}
  .brand small{display:none}
  nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
  nav::-webkit-scrollbar{display:none}
  nav{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);padding:0 6px}
  nav button{white-space:nowrap;flex:none}
  main{flex-direction:column}
  #stage{flex:none;height:56vh;height:56svh;min-height:280px}
  aside{width:100%;border-left:0;border-top:1px solid var(--line)}
  #hud{font-size:15px}
  #legend{font-size:13px;max-width:210px;padding:8px 10px}
}
@media (max-width:600px){
  .brand .bt{display:none}
  nav button .full{display:none}
  nav button .short{display:inline}
  nav button{padding:9px 11px;font-size:14.5px}
  aside{padding:14px 16px 28px}
  aside h2{font-size:21px}
  #hud{font-size:13.5px;padding:7px 10px;left:8px;top:8px;max-width:calc(100% - 16px)}
  #legend{font-size:12px;max-width:185px;left:8px;bottom:8px;padding:7px 9px}
  .lg i{width:20px;height:13px}
  #hint{display:none}
}
@media (orientation:landscape) and (max-height:560px){
  html,body{height:100%}
  body{overflow:hidden}
  header{position:static;padding:4px 8px}
  .brand{display:none}
  nav button{padding:6px 10px;font-size:13.5px}
  .tools button{padding:6px 10px}
  main{flex-direction:row}
  #stage{flex:1;height:auto;min-height:0}
  aside{width:min(42vw,360px);border-left:1px solid var(--line);border-top:0;padding:12px 14px 24px}
  aside h2{font-size:19px}
  #hud{font-size:13px;padding:6px 9px;left:8px;top:8px}
  #legend{font-size:11.5px;max-height:calc(100% - 16px);overflow:auto;left:8px;bottom:8px}
  #hint{display:none}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
<header>
  <div class="brand">🌍<span class="bt"> Geografia in 3D</span><small>orientamento · carte · scale · coordinate · isolinee</small></div>
  <nav id="tabs"></nav>
  <div class="tools">
    <button id="btn-fs" class="ghost" title="Schermo intero">⛶</button>
  </div>
</header>
<main>
  <div id="stage">
    <div id="hud"></div>
    <div id="legend"></div>
    <div id="hint">Trascina per ruotare · rotellina o due dita per lo zoom</div>
  </div>
  <aside id="panel"></aside>
</main>

<div id="err" hidden>Per funzionare il modello 3D ha bisogno di una connessione internet (carica la libreria Three.js) e di un browser aggiornato.</div>

<script>
if(typeof THREE==='undefined'||!THREE.OrbitControls){document.getElementById('err').hidden=false;throw new Error('Three.js non caricato');}

/* =========================================================
   UTILITÀ GENERALI
   ========================================================= */
const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const el=id=>document.getElementById(id);
const on=(id,ev,fn)=>{const e=el(id);if(e)e.addEventListener(ev,fn);};
const fmt=(n,d=1)=>Number(n).toLocaleString('it-IT',{maximumFractionDigits:d,minimumFractionDigits:0});

const stage=el('stage'), panel=el('panel'), hud=el('hud'), legend=el('legend');
const renderer=new THREE.WebGLRenderer({antialias:true});
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0, SMALL=Math.min(screen.width,screen.height)<700;
const SHADOW=IS_TOUCH?1024:2048;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,IS_TOUCH?1.5:2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,1,0.1,600);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08;
const raycaster=new THREE.Raycaster();

function resize(){const w=stage.clientWidth,h=stage.clientHeight,old=camera.aspect;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(typeof current!=='undefined'&&current&&current.enter&&Math.abs(Math.log(camera.aspect/old))>.25)current.enter();}
window.addEventListener('resize',resize);

function setHud(html){hud.innerHTML=html||'';hud.style.display=html?'block':'none';}
function setLegend(html){legend.innerHTML=html||'';legend.style.display=html?'block':'none';}
legend.addEventListener('click',()=>legend.classList.toggle('mini'));

/* animazioni con chiave (una nuova sostituisce quella vecchia) */
const anims=new Map();
function animate(key,dur,fn,done){anims.set(key,{t:0,dur,fn,done});}
function runAnims(dt){for(const [k,a] of anims){a.t=Math.min(1,a.t+dt/a.dur);a.fn(ease(a.t));if(a.t>=1){anims.delete(k);a.done&&a.done();}}}

/* volo della telecamera */
let camTween=null;
/* adatta la distanza della telecamera agli schermi stretti (tablet in verticale, smartphone) */
const REF_ASPECT=1.27;
function flyTo(pos,target,dur=1.3,fit=true){const t=new THREE.Vector3(...target),p=new THREE.Vector3(...pos);
  if(fit){const f=Math.max(1,REF_ASPECT/camera.aspect);p.sub(t).multiplyScalar(f).add(t);}
  camTween={p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:t,t:0,dur};}
function updateTween(dt){if(!camTween)return;camTween.t=Math.min(1,camTween.t+dt/camTween.dur);const k=ease(camTween.t);
  camera.position.lerpVectors(camTween.p0,camTween.p1,k);controls.target.lerpVectors(camTween.t0,camTween.t1,k);if(camTween.t>=1)camTween=null;}

/* etichette (sprite con testo disegnato su canvas) */
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}
function makeLabel(text,o={}){
  const h=(o.h??0.6)*(SMALL?1.25:1), font=o.font??56, color=o.color??'#ffffff', bg=o.bg===undefined?'rgba(19,32,51,.85)':o.bg;
  const c=document.createElement('canvas'), x=c.getContext('2d');
  const f=`${o.italic?'italic ':''}${o.weight??700} ${font}px "Atkinson Hyperlegible",system-ui,sans-serif`;
  x.font=f; const W=Math.ceil(x.measureText(text).width+font*0.8), H=Math.ceil(font*1.45);
  c.width=W;c.height=H;x.font=f;
  if(bg){x.fillStyle=bg;rr(x,0,0,W,H,H*.3);x.fill();}
  if(o.stroke){x.lineWidth=font*.16;x.strokeStyle=o.stroke;x.lineJoin='round';}
  x.textAlign='center';x.textBaseline='middle';
  if(o.stroke)x.strokeText(text,W/2,H/2+2);
  x.fillStyle=color;x.fillText(text,W/2,H/2+2);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:!!o.depth,depthWrite:false}));
  sp.scale.set(h*W/H,h,1);sp.renderOrder=o.depth?1:20;return sp;
}
function starPath(x,cx,cy,R,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;x.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}x.closePath();}
function drawIcon(x,type,cx,cy){
  x.lineWidth=5;x.strokeStyle='#1b2430';
  if(type==='city'){x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,19,0,TAU);x.fill();x.stroke();x.fillStyle='#1b2430';x.beginPath();x.arc(cx,cy,8,0,TAU);x.fill();}
  if(type==='capital'){starPath(x,cx,cy,30,13);x.fillStyle='#d62828';x.fill();x.lineWidth=4;x.stroke();}
  if(type==='peak'){x.beginPath();x.moveTo(cx,cy-24);x.lineTo(cx+24,cy+18);x.lineTo(cx-24,cy+18);x.closePath();x.fillStyle='#7a4a1c';x.fill();x.lineWidth=3;x.stroke();}
}
function makeSymbol(type,text,o={}){
  const h=(o.h??0.8)*(SMALL?1.2:1), font=46, pad=12, H=96;
  const c=document.createElement('canvas'), x=c.getContext('2d');
  const f=`700 ${font}px "Atkinson Hyperlegible",system-ui,sans-serif`;x.font=f;
  const tw=text?x.measureText(text).width:0, W=Math.ceil(90+(text?tw+pad*2+8:0));
  c.width=W;c.height=H;x.font=f;
  if(text){x.fillStyle='rgba(255,255,255,.88)';rr(x,72,H/2-31,tw+pad*2+14,62,14);x.fill();}
  drawIcon(x,type,45,H/2);
  if(text){x.fillStyle=o.color??'#1b2430';x.textBaseline='middle';x.fillText(text,90+pad-6,H/2+2);}
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.center.set(45/W,.5);sp.scale.set(h*W/H,h,1);sp.renderOrder=20;return sp;
}
function radialTex(color){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,color);g.addColorStop(.35,color+'aa');g.addColorStop(1,color+'00');
  x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
function starsField(n=900,r=180){const p=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new THREE.Vector3().randomDirection?new THREE.Vector3().randomDirection():new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();
  p.set([v.x*r,v.y*r,v.z*r],i*3);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  return new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.7,sizeAttenuation:true,transparent:true,opacity:.75}));}
function grad(stops,h,out){if(h<=stops[0][0])return out.set(stops[0][1]);for(let i=1;i<stops.length;i++){if(h<=stops[i][0]){const t=(h-stops[i-1][0])/(stops[i][0]-stops[i-1][0]);
  return out.set(stops[i-1][1]).lerp(new THREE.Color(stops[i][1]),t);}}return out.set(stops[stops.length-1][1]);}
function tube(pts,r,mat,closed=false){const curve=new THREE.CatmullRomCurve3(pts,closed);return new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(8,pts.length*2),r,8,closed),mat);}
function disposeGroup(g){while(g.children.length){const c=g.children.pop();c.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map&&o.isSprite)o.material.map.dispose();o.material.dispose&&o.material.dispose();}});}}

/* lettura ad alta voce (Web Speech API) */
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=.95;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('it'));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}

/* =========================================================
   IL NOSTRO TERRITORIO (usato da "Dalla realtà alla carta" e "Scala")
   Area reale: da Marina di Pisa a Pontedera, dal Monte Pisano a Collesalvetti.
   Fonti: altitudini EU-DEM (Copernicus); confini comunali ISTAT (openpolis);
   Arno, strade, vette e centri abitati da OpenStreetMap.
   1 unità = 2 km; altezze esagerate 5 volte.

const PALETTE=['#f2b880','#9fd08a','#f5e17a','#c9a7e0','#f3a0a0','#8fd3d0'];
function decodeTopo(topo,obj){
  const tf=topo.transform;
  const arcs=topo.arcs.map(a=>{let x=0,y=0;return a.map(p=>{if(tf){x+=p[0];y+=p[1];return [x*tf.scale[0]+tf.translate[0],y*tf.scale[1]+tf.translate[1]];}return p;});});
  const arc=i=>i>=0?arcs[i]:arcs[~i].slice().reverse();
  const ring=idx=>{const pts=[];idx.forEach((i,k)=>arc(i).forEach((p,j)=>{if(k>0&&j===0)return;pts.push(p);}));return pts;};
  const feats=obj.geometries.map(g=>({name:(g.properties||{}).name||'',arcs:g.arcs,
    polys:g.type==='Polygon'?[g.arcs.map(ring)]:g.type==='MultiPolygon'?g.arcs.map(p=>p.map(ring)):[]}));
  // vicini = Stati che condividono un arco (per colorare la carta politica)
  const owner=new Map();
  feats.forEach((f,fi)=>{const walk=a=>Array.isArray(a)?a.forEach(walk):(()=>{const k=a<0?~a:a;if(!owner.has(k))owner.set(k,new Set());owner.get(k).add(fi);})();if(f.arcs)walk(f.arcs);});
  const nb=feats.map(()=>new Set());owner.forEach(s=>s.forEach(a=>s.forEach(b=>{if(a!==b)nb[a].add(b);})));
  const colors=[];feats.forEach((f,i)=>{const used=new Set([...nb[i]].map(j=>colors[j]).filter(c=>c!==undefined));let c=0;while(used.has(c))c++;colors[i]=c%PALETTE.length;});
  return {feats,colors};
}
function drawEarth(){
  const x=earthCanvas.getContext('2d'),W=earthCanvas.width,H=earthCanvas.height;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2c5f96');g.addColorStop(.5,'#3a7fc0');g.addColorStop(1,'#2c5f96');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  if(!world){x.fillStyle='rgba(255,255,255,.9)';x.font='bold 54px sans-serif';x.textAlign='center';x.fillText(worldMsg,W/2,H/2);earthTex.needsUpdate=true;return;}
  x.lineJoin='round';
  world.feats.forEach((f,i)=>{
    const fill=earthMode==='politica'?PALETTE[world.colors[i]]:'#79ad58';
    x.strokeStyle=earthMode==='politica'?'rgba(60,40,30,.75)':'rgba(40,70,30,.6)';x.lineWidth=earthMode==='politica'?1.4:1;
    for(const poly of f.polys){
      let jump=false;for(const r of poly){for(let k=1;k<r.length;k++)if(Math.abs(r[k][0]-r[k-1][0])>180){jump=true;break;}if(jump)break;}
      for(const off of (jump?[-360,0,360]:[0])){
        x.beginPath();
        for(const r of poly){let prev=null;r.forEach((p,k)=>{let lon=p[0];if(jump){if(prev!==null){while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360;}prev=lon;}
          const X=(lon+off+180)/360*W,Y=(90-p[1])/180*H;k?x.lineTo(X,Y):x.moveTo(X,Y);});x.closePath();}
        x.fillStyle=fill;x.fill('evenodd');x.stroke();

    }
    if(f.name==='Antarctica'){x.fillStyle=fill;x.fillRect(0,(90+85)/180*H,W,H);}
  });
  earthTex.needsUpdate=true;
}

  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false}));m.renderOrder=3;return m;}

/* =========================================================
   5. DAL GLOBO AL PLANISFERO
   ========================================================= */
const PR=5;
/* Proiezione di Mercatore: i paralleli si allontanano verso i poli (y = ln tan(45°+lat/2)) */
const MERC_MAX=84;
const merc=la=>Math.log(Math.tan(Math.PI/4+clamp(la,-MERC_MAX*D2R,MERC_MAX*D2R)/2));
const MERC_Y=merc(MERC_MAX*D2R);
function morphPos(latD,lonD,m,out,lift=0){
  const la0=latD*D2R,lo=lonD*D2R,la=lerp(la0,merc(la0),m);
  if(m>.999)return out.set(PR*lo,PR*la,PR+lift);
  const Rm=PR/(1-m),a=la*(1-m),b=lo*(1-m);
  const nx=Math.cos(a)*Math.sin(b),ny=Math.sin(a),nz=Math.cos(a)*Math.cos(b);
  return out.set((Rm+lift)*nx,(Rm+lift)*ny,PR-Rm+(Rm+lift)*nz);
}
function destLL(lat0,lon0,bearing,dist){const p0=lat0*D2R,l0=lon0*D2R,b=bearing,d=dist*D2R;
  const p=Math.asin(Math.sin(p0)*Math.cos(d)+Math.cos(p0)*Math.sin(d)*Math.cos(b));
  const l=l0+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p0),Math.cos(d)-Math.sin(p0)*Math.sin(p));return [p/D2R,l/D2R];}

/* =========================================================
   6. ISOLINEE – CURVE DI LIVELLO
   1 unità di altezza = 200 m
   ========================================================= */
function hIso(x,z){const dx=x-1,sx=dx<0?1.5:3.4;let h=5*Math.exp(-(dx*dx/(2*sx*sx)+z*z/(2*2.2*2.2)));
  h+=2*Math.exp(-((x+4.5)**2/(2*1.3*1.3)+(z-3.5)**2/(2*1.5*1.5)));h+=.04*Math.sin(x*2.1+z*1.3);return h;}
function ribbonGeo(segs,y,w){const n=segs.length/4,pos=new Float32Array(n*18);
  for(let k=0;k<n;k++){const x1=segs[4*k],z1=segs[4*k+1],x2=segs[4*k+2],z2=segs[4*k+3],dx=x2-x1,dz=z2-z1,l=Math.hypot(dx,dz)||1;
    const px=-dz/l*w/2,pz=dx/l*w/2,ex=dx/l*w*.4,ez=dz/l*w*.4;
    pos.set([x1-ex+px,y,z1-ez+pz,x1-ex-px,y,z1-ez-pz,x2+ex+px,y,z2+ez+pz,x1-ex-px,y,z1-ez-pz,x2+ex-px,y,z2+ez-pz,x2+ex+px,y,z2+ez+pz],k*18);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));return g;}

    <div class="row"><button id="i-flat" class="pri">🗺️ Schiaccia sulla carta</button><button id="i-3d">⛰️ Torna in 3D</button></div>
    <label class="rng"><span>Montagna</span><span>Carta</span></label>
    <input type="range" id="i-p" min="0" max="100" value="0">
    <table><tr><th>Curve di livello…</th><th>Il pendio è…</th></tr><tr><td>vicine tra loro</td><td><b>ripido</b></td></tr><tr><td>lontane tra loro</td><td><b>dolce</b></td></tr><tr><td>chiuse una dentro l'altra</td><td>una <b>cima</b> (al centro)</td></tr></table>
    <h3>Altre isolinee</h3>
    <p><b>Isoterme</b>: uniscono i punti con la stessa temperatura.<br><b>Isobare</b>: uniscono i punti con la stessa pressione atmosferica.<br><b>Isoiete</b>: uniscono i punti con la stessa quantità di pioggia.<br><b>Isobate</b>: uniscono i punti del fondale con la stessa profondità.</p>`;},
  bind(){
    on('i-w','input',e=>{if(this.p>.01)this.setP(0);this.setWater(+e.target.value);});
    panel.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{if(this.p>.01){this.setP(0);flyTo([11,10,15],[0,1.5,0]);}const w0=this.water,w1=+b.dataset.w;animate('water',1.2,k=>this.setWater(lerp(w0,w1,k)));}));
    on('i-draw','click',()=>{this.setWater(0);this.drawAll();});
    on('i-flat','click',()=>this.flat(1));on('i-3d','click',()=>this.flat(0));
    on('i-p','input',e=>{anims.delete('isoP');if(!this.cG.visible){this.cG.visible=true;this.levelMeshes.forEach(m=>m.visible=true);}this.setWater(0);this.setP(e.target.value/100);});
    const r=el('i-p');if(r)r.value=Math.round(this.p*100);const w=el('i-w');if(w)w.value=this.water;
  },
  enter(){controls.maxPolarAngle=Math.PI/2-.05;controls.minDistance=5;controls.maxDistance=50;
    if(this.p>.5)flyTo([0,21,.01],[0,0,0]);else flyTo([11,10,15],[0,1.5,0]);this.setP(this.p);this.setWater(this.water);}
};

on('btn-fs','click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();});

/* clic sulla scena (distinto dal trascinamento) */
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
  if(d<7&&current&&current.onClick){const r=renderer.domElement.getBoundingClientRect();
    raycaster.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);current.onClick(raycaster);}});

/* avvio */
const tabs=el('tabs');
const SHORT={orient:'Orientamento',map:'Carte',scale:'Scala',globe:'Globo',planis:'Planisfero',iso:'Isolinee'};
['orient','map','scale','globe','planis','iso'].forEach((id,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="full">${modules[id].tab}</span><span class="short">${i+1} · ${SHORT[id]}</span>`;b.dataset.id=id;b.onclick=()=>show(id);tabs.appendChild(b);});
if(IS_TOUCH)el('hint').textContent='Un dito: ruota · due dita: zoom e sposta';
if(!document.documentElement.requestFullscreen)el('btn-fs').style.display='none';
if(stage.clientWidth<600)legend.classList.add('mini');
resize();
camera.position.set(0,11,27);controls.target.set(0,1.5,0);
show('orient');
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.25,Math.max(0,(now-last)/1000));last=now;
  runAnims(dt);updateTween(dt);if(current&&current.update)current.update(dt);controls.update();
  if(current)renderer.render(current.scene,camera);}
requestAnimationFrame(loop);
</script>
</body>
</html>
